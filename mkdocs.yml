# BufferCache 文档站点配置（D9：mkdocs 构建检查的输入）
# 构建验证：python -m mkdocs build --strict（无 mkdocs 时 self_verify 自动 SKIP）
# 站点化发布由 CI/运维流程决定，本文件仅保证 docs/ 可构建

site_name: BufferCache 缓存知识体系
site_description: 从硬件到算法、从理论到工程的 Buffer Cache 知识体系
docs_dir: docs

theme:
  name: material
  language: zh

markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true

nav:
  - 首页: INDEX.md
  - 项目总览: 00-项目总览/README.md
  - 理论基础: 01-理论基础/README.md
  - 系统实现: 02-系统实现/README.md
  - Redis组件: 03-Redis组件/README.md
  - 架构设计: 04-架构设计/README.md
  - 全栈分析: 05-全栈分析/README.md
  - 运维与部署: 07-运维与部署/README.md
  - 分布式架构: 08-分布式架构/README.md
